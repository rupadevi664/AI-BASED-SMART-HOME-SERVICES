# ==============================================================================
# Render.com Infrastructure Blueprint
# Deploy both services and database with one click in the Render Dashboard
# ==============================================================================
services:
  # --- Backend Web Service (FastAPI) ---
  - type: web
    name: smarthome-backend
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "python -m app.init_db --admin && python scripts/index_knowledge.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: smarthome-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # --- Frontend Static Site (React + Vite) ---
  - type: web
    name: smarthome-frontend
    env: static
    region: oregon
    plan: starter
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smarthome-backend
          property: host
      - key: VITE_WS_BASE_URL
        fromService:
          type: web
          name: smarthome-backend
          property: host

databases:
  # --- Managed Database ---
  - name: smarthome-db
    region: oregon
    plan: starter
    databaseName: ai_home_services
    user: home_user
