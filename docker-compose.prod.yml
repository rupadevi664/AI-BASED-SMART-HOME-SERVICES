version: '3.8'

# ==============================================================================
# Production Docker Compose Configuration (Cloud VPS / Dedicated Server)
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# ==============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: smarthome-prod-mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_home_services}
      MYSQL_USER: ${MYSQL_USER:-home_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - smarthome-internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smarthome-prod-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-home_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-ai_home_services}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: "Platform Admin"
      CORS_ORIGINS: ${CORS_ORIGINS}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_CURRENCY: ${RAZORPAY_CURRENCY:-INR}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      ENVIRONMENT: production
      PORT: 8000
    volumes:
      - chroma_prod_data:/app/backend/chroma_data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - smarthome-internal

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
    container_name: smarthome-prod-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - smarthome-internal

volumes:
  mysql_prod_data:
    name: smarthome_prod_mysql_data
  chroma_prod_data:
    name: smarthome_prod_chroma_data

networks:
  smarthome-internal:
    name: smarthome_prod_network
    driver: bridge
